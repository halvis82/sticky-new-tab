<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Wide screens get the board at desktop.html: the same new tab page as the extension, with
    // every note where it is there. ?classic keeps this layout.
    if (matchMedia('(min-width: 800px)').matches && !/[?&]classic\b/.test(location.search)) {
      location.replace('desktop.html' + location.hash);
    }
  </script>
  <title>Notes</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body data-sync="connecting">
  <div id="app">
    <aside id="list-pane">
      <header class="bar list-bar">
        <h1>Notes <span id="status" class="dot" title="Connecting"></span></h1>
        <button id="history-btn" class="icon-btn" title="History" aria-label="History">
          <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </button>
        <button id="new" class="icon-btn accent" title="New note" aria-label="New note">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
        </button>
      </header>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false">
      </div>
      <ul id="list" aria-label="Notes"></ul>
    </aside>

    <section id="history-pane" aria-label="History">
      <header class="bar history-bar">
        <button id="history-back" class="text-btn" aria-label="Back to notes">
          <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
          <span>Notes</span>
        </button>
        <h2>History</h2>
      </header>
      <div id="history-box"></div>
    </section>

    <main id="editor-pane">
      <header class="bar editor-bar">
        <button id="back" class="text-btn" aria-label="Back to notes">
          <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
          <span>Notes</span>
        </button>
        <span id="edited" class="edited"></span>
        <span class="grow"></span>
        <span class="dot mirror" aria-hidden="true"></span>
        <button id="copy-all" class="icon-btn" title="Copy whole note" aria-label="Copy whole note">
          <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
        <button id="color" class="icon-btn" title="Color" aria-label="Color">
          <span class="swatch"></span>
        </button>
        <button id="delete" class="icon-btn" title="Delete note" aria-label="Delete note">
          <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
      </header>

      <div id="palette" class="pop" hidden></div>

      <div id="toolbar" role="toolbar" aria-label="Formatting">
        <button data-cmd="bold" title="Bold (⌘B)" aria-label="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic (⌘I)" aria-label="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline (⌘U)" aria-label="Underline"><u>U</u></button>
        <button data-cmd="strikeThrough" title="Strikethrough (⌘⇧X)" aria-label="Strikethrough"><s>S</s></button>
        <span class="sep"></span>
        <button data-cmd="link" title="Link (⌘K)" aria-label="Link">
          <svg viewBox="0 0 24 24"><path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/></svg>
        </button>
        <button data-cmd="image" title="Add image or file" aria-label="Add image or file">
          <svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>
        </button>
        <button data-cmd="clear" title="Clear formatting" aria-label="Clear formatting">
          <svg viewBox="0 0 24 24"><path d="M3.27 5 2 6.27l6.97 6.97L6.5 19h3l1.57-3.66L16.73 21 18 19.73 3.55 5.27 3.27 5zM6 5v.18L8.82 8h2.4l-.72 1.68 2.1 2.1L14.21 8H20V5H6z"/></svg>
        </button>
        <span class="sep"></span>
        <button data-cmd="undo" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.95 7.95 0 0 1 20.34 16l2.37-.78A10.5 10.5 0 0 0 12.5 8z"/></svg>
        </button>
        <button data-cmd="redo" title="Redo (⌘⇧Z)" aria-label="Redo">
          <svg viewBox="0 0 24 24"><path d="M18.4 10.6A10.46 10.46 0 0 0 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16a7.95 7.95 0 0 1 12.72-3.62L13 16h9V7l-3.6 3.6z"/></svg>
        </button>
        <span class="grow"></span>
        <button data-cmd="done" class="done" title="Done" aria-label="Done typing">Done</button>
      </div>

      <div id="sheet">
        <input id="title" type="text" placeholder="Title" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" aria-label="Title">
        <div id="editor" contenteditable="true" spellcheck="true" autocapitalize="sentences"></div>
      </div>

      <div id="nothing">
        <p>Pick a note, or make a new one.</p>
      </div>
    </main>
  </div>

  <div id="menu" class="pop" hidden></div>

  <div id="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" hidden></button>
  </div>

  <input id="file" type="file" multiple hidden>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="history.js"></script>
  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
